name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Dama APK with C++ Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 25.2.9519653 and CMake 3.22.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Prepare Gradle wrapper
        run: |
          chmod +x android/gradlew
          if [ ! -f ./gradlew ]; then
            cp android/gradlew ./gradlew
            cp -r android/gradle ./gradle
          fi
          chmod +x ./gradlew

      - name: Build APK via Gradle (Release & Debug)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace
          cd ..
          mkdir -p app/build/outputs/apk/release
          cp -r android/app/build/outputs/apk/release/* app/build/outputs/apk/release/ || true

      - name: Upload Dama APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dama-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
